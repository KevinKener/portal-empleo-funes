<circle class="viajero" r="9" fill="#fff" stroke="#074a1f" stroke-width="4"><animateMotion dur="10s" repeatCount="indefinite" path="M 50 105.0 L 50 585.0" keyPoints="0;1;1" keyTimes="0;0.62;1" calcMode="linear"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.62;0.66;1"/></circle>
</svg>